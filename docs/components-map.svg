<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1240" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#555"/>
    </marker>
    <style>
      .hd{fill:#5b5470}.ht{fill:#fff;font-size:20px;font-weight:700;text-anchor:middle}
      .ac{fill:#6e6585}.at{fill:#fff;font-size:19px;font-weight:700;text-anchor:middle}.as{fill:#e6e2ee;font-size:14.5px;text-anchor:middle}
      .t{font-size:15.5px;fill:#222;text-anchor:middle}
      .blue{fill:#f1f5ff;stroke:#4a6fd8;stroke-width:2}.green{fill:#eef8f2;stroke:#3c9a64;stroke-width:2}
      .yellow{fill:#fff8dc;stroke:#d6b13a;stroke-width:2}.red{fill:#fff0f3;stroke:#c9506f;stroke-width:2}.orange{fill:#fff4e3;stroke:#e09a3c;stroke-width:2}
      .ln{stroke:#555;stroke-width:1.7;stroke-dasharray:6 5;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="2000" height="1240" fill="#fff"/>
  <text x="1000" y="50" text-anchor="middle" font-size="32" font-weight="700" fill="#2b2840">Aangan Studio Front Desk — Components Map</text>

  <!-- column headers -->
  <g>
    <rect class="hd" x="23" y="125" width="204" height="65" rx="8"/><text class="ht" x="125" y="165">Actor</text>
    <rect class="hd" x="231" y="125" width="286" height="65" rx="8"/><text class="ht" x="374" y="165">Trigger</text>
    <rect class="hd" x="524" y="125" width="286" height="65" rx="8"/><text class="ht" x="667" y="165">Input</text>
    <rect class="hd" x="817" y="125" width="286" height="65" rx="8"/><text class="ht" x="960" y="165">Context</text>
    <rect class="hd" x="1110" y="125" width="286" height="65" rx="8"/><text class="ht" x="1253" y="165">Processing</text>
    <rect class="hd" x="1403" y="125" width="286" height="65" rx="8"/><text class="ht" x="1546" y="165">AI</text>
    <rect class="hd" x="1696" y="125" width="286" height="65" rx="8"/><text class="ht" x="1839" y="165">Output</text>
  </g>

  <!-- lane backgrounds -->
  <g fill="#f6f7fa">
    <rect x="227" y="195" width="1760" height="128"/><rect x="227" y="459" width="1760" height="128"/>
    <rect x="227" y="723" width="1760" height="128"/><rect x="227" y="987" width="1760" height="128"/>
  </g>

  <!-- actors -->
  <g>
    <rect class="ac" x="23" y="195" width="197" height="125" rx="8"/><text class="at" x="121" y="252">Client</text><text class="as" x="121" y="276">(Caller)</text>
    <rect class="ac" x="23" y="329" width="197" height="125" rx="8"/><text class="at" x="121" y="386">Ayaan</text><text class="as" x="121" y="410">(Vaani voice agent)</text>
    <rect class="ac" x="23" y="463" width="197" height="125" rx="8"/><text class="at" x="121" y="520">Front Desk App</text><text class="as" x="121" y="544">(Next.js on Vercel)</text>
    <rect class="ac" x="23" y="597" width="197" height="125" rx="8"/><text class="at" x="121" y="654">Neon Postgres</text><text class="as" x="121" y="678">(Database)</text>
    <rect class="ac" x="23" y="731" width="197" height="125" rx="8"/><text class="at" x="121" y="788">Gemini API</text><text class="as" x="121" y="812">(AI extractor)</text>
    <rect class="ac" x="23" y="865" width="197" height="125" rx="8"/><text class="at" x="121" y="922">Telegram Bot</text><text class="as" x="121" y="946">(Designer alerts)</text>
    <rect class="ac" x="23" y="999" width="197" height="125" rx="8"/><text class="at" x="121" y="1056">Studio Team</text><text class="as" x="121" y="1080">(Founder / Designers)</text>
  </g>

  <!-- Client: trigger -->
  <rect class="blue" x="247" y="208" width="253" height="100" rx="10"/>
  <text class="t" x="374" y="240">Opens the call page</text><text class="t" x="374" y="262">Name + number, agrees</text><text class="t" x="374" y="284">to recording, taps Call</text>

  <!-- Ayaan: input -->
  <rect class="blue" x="540" y="342" width="253" height="100" rx="10"/>
  <text class="t" x="667" y="370">Live voice call (WebRTC)</text><text class="t" x="667" y="392">“Good evening, Rahul!”</text><text class="t" x="667" y="414">One question at a time</text>

  <!-- Ayaan: context -->
  <rect class="green" x="833" y="342" width="253" height="100" rx="10"/>
  <text class="t" x="960" y="366">Agent script: services,</text><text class="t" x="960" y="388">5 checks, fixed price line,</text><text class="t" x="960" y="410">returning-caller context</text><text class="t" x="960" y="432">(never says a price)</text>

  <!-- Ayaan: output to client -->
  <rect class="orange" x="1713" y="208" width="253" height="100" rx="10"/>
  <text class="t" x="1839" y="236">Polite close: consultation</text><text class="t" x="1839" y="258">booked (online / studio),</text><text class="t" x="1839" y="280">or a kind “not a fit”</text>

  <!-- App: input -->
  <rect class="blue" x="540" y="476" width="253" height="100" rx="10"/>
  <text class="t" x="667" y="504">After hang-up: pulls the</text><text class="t" x="667" y="526">transcript from Vaani</text><text class="t" x="667" y="548">(+ daily backup job)</text>

  <!-- App: context -->
  <rect class="green" x="833" y="476" width="253" height="100" rx="10"/>
  <text class="t" x="960" y="504">Caller history: new,</text><text class="t" x="960" y="526">returning or dropped call</text><text class="t" x="960" y="548">Studio rules from Settings</text>

  <!-- App: processing -->
  <rect class="yellow" x="1126" y="470" width="253" height="112" rx="10"/>
  <text class="t" x="1253" y="496">Code, not AI: 5 checks →</text><text class="t" x="1253" y="518">qualified / not a fit /</text><text class="t" x="1253" y="540">complaint / call back;</text><text class="t" x="1253" y="562">price-leak scan; books slot</text>

  <!-- App: AI validation -->
  <rect class="red" x="1419" y="476" width="253" height="100" rx="10"/>
  <text class="t" x="1546" y="504">Validates JSON (Zod)</text><text class="t" x="1546" y="526">1 retry, else flagged</text><text class="t" x="1546" y="548">“needs review”</text>

  <!-- DB -->
  <rect class="green" x="833" y="610" width="253" height="100" rx="10"/>
  <text class="t" x="960" y="634">callers · calls · leads</text><text class="t" x="960" y="656">bookings · tasks · alerts</text><text class="t" x="960" y="678">Row-level security</text><text class="t" x="960" y="700">Transcripts kept 30 days</text>

  <!-- Gemini -->
  <rect class="red" x="1419" y="744" width="253" height="100" rx="10"/>
  <text class="t" x="1546" y="768">Reads transcript, returns</text><text class="t" x="1546" y="790">strict JSON: area, scope,</text><text class="t" x="1546" y="812">timeline, budget, decider,</text><text class="t" x="1546" y="834">consultation slot</text>

  <!-- Telegram -->
  <rect class="orange" x="1713" y="878" width="253" height="100" rx="10"/>
  <text class="t" x="1839" y="902">Designer alert: snapshot,</text><text class="t" x="1839" y="924">slot + video link,</text><text class="t" x="1839" y="946">transcript link,</text><text class="t" x="1839" y="968">“Acknowledge” button</text>

  <!-- Team trigger + output -->
  <rect class="blue" x="247" y="1012" width="253" height="100" rx="10"/>
  <text class="t" x="374" y="1040">Opens the dashboard</text><text class="t" x="374" y="1062">“Viewing as” founder or</text><text class="t" x="374" y="1084">designer (no login page)</text>
  <rect class="orange" x="1713" y="1004" width="253" height="116" rx="10"/>
  <text class="t" x="1839" y="1028">CRM: brief → full transcript</text><text class="t" x="1839" y="1050">Leads pipeline, complaints,</text><text class="t" x="1839" y="1072">follow-up tasks, call costs,</text><text class="t" x="1839" y="1094">editable rules</text>

  <!-- arrows -->
  <path class="ln" d="M500 258 H667 V339"/>
  <path class="ln" d="M793 392 H830"/>
  <path class="ln" d="M1086 370 H1839 V305"/>
  <path class="ln" d="M667 442 V473"/>
  <path class="ln" d="M793 526 H830"/>
  <path class="ln" d="M1016 576 V607"/>
  <path class="ln" d="M1086 556 H1100 V794 H1416"/>
  <path class="ln" d="M1546 744 V579"/>
  <path class="ln" d="M1419 526 H1382"/>
  <path class="ln" d="M1253 582 V660 H1089"/>
  <path class="ln" d="M1379 492 H1395 V450 H1690 V928 H1710"/>
  <path class="ln" d="M1253 660 H1700 V1060 H1710"/>
  <path class="ln" d="M500 1062 H1600 V1090 H1710"/>

  <text x="23" y="1170" font-size="16.5" fill="#222"><tspan fill="#2f9a5c" font-weight="700">Deliberately NOT built (scope cut):</tspan> quoting prices, payments, client emails from us, a login page, a real phone number, and designers’ live calendars.</text>
  <text x="23" y="1198" font-size="16.5" fill="#222">The AI only <tspan font-weight="700">extracts facts</tspan>; plain code makes every routing decision, and the team stays in control of the lead.</text>
</svg>
